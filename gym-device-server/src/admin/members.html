<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Members</title>
<style>
*{box-sizing:border-box;margin:0;padding:0}
body{font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;background:#0f172a;color:#e2e8f0;min-height:100vh}
header{background:#1e293b;padding:14px 20px;display:flex;align-items:center;justify-content:space-between;border-bottom:1px solid #334155;position:sticky;top:0;z-index:10}
header h1{font-size:17px;font-weight:600}
header a{color:#94a3b8;font-size:13px;text-decoration:none}
.top-bar{display:flex;gap:10px;align-items:center;padding:16px 20px;flex-wrap:wrap}
.top-bar select{background:#1e293b;border:1px solid #334155;color:#e2e8f0;padding:7px 10px;border-radius:6px;font-size:13px}
.btn{padding:7px 16px;border:none;border-radius:6px;cursor:pointer;font-size:13px;font-weight:500}
.btn-primary{background:#3b82f6;color:#fff}.btn-primary:hover{background:#2563eb}
.btn-green{background:#16a34a;color:#fff}.btn-green:hover{background:#15803d}
.btn-red{background:#dc2626;color:#fff}.btn-red:hover{background:#b91c1c}
.btn-sm{padding:4px 10px;font-size:12px;border-radius:5px}
.btn-purple{background:#7c3aed;color:#fff}
.btn-cyan{background:#0891b2;color:#fff}
.btn-teal{background:#0d9488;color:#fff}
.container{padding:0 20px 40px}
.card{background:#1e293b;border-radius:10px;border:1px solid #334155;overflow:hidden;margin-bottom:20px}
.card-head{padding:14px 16px;border-bottom:1px solid #334155;font-size:14px;font-weight:600;display:flex;justify-content:space-between;align-items:center}
table{width:100%;border-collapse:collapse}
th{background:#0f172a;padding:9px 14px;text-align:left;font-size:11px;text-transform:uppercase;letter-spacing:.5px;color:#64748b}
td{padding:10px 14px;border-top:1px solid #0f172a;font-size:13px;vertical-align:middle}
tr:hover td{background:#ffffff06}
.badge{display:inline-block;padding:2px 8px;border-radius:12px;font-size:11px;font-weight:600}
.g{background:#14532d;color:#86efac}.r{background:#450a0a;color:#fca5a5}.y{background:#451a03;color:#fcd34d}.gray{background:#1e293b;color:#64748b;border:1px solid #334155}
.modal-bg{display:none;position:fixed;inset:0;background:#00000088;z-index:50;align-items:center;justify-content:center}
.modal-bg.open{display:flex}
.modal{background:#1e293b;border-radius:12px;border:1px solid #334155;padding:24px;width:100%;max-width:460px;max-height:90vh;overflow-y:auto}
.modal h2{font-size:16px;font-weight:600;margin-bottom:18px}
.form-group{margin-bottom:14px}
.form-group label{display:block;font-size:12px;color:#94a3b8;margin-bottom:5px}
.form-group input,.form-group select,.form-group textarea{width:100%;background:#0f172a;border:1px solid #334155;color:#e2e8f0;padding:8px 10px;border-radius:6px;font-size:13px}
.form-group input:focus,.form-group select:focus{outline:none;border-color:#3b82f6}
.form-row{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.modal-footer{display:flex;gap:8px;justify-content:flex-end;margin-top:20px}
.enroll-section{background:#0f172a;border-radius:8px;padding:12px;margin-top:10px}
.enroll-section p{font-size:12px;color:#64748b;margin-bottom:8px}
.enroll-btns{display:flex;gap:6px;flex-wrap:wrap}
.toast{position:fixed;bottom:20px;right:20px;background:#1e293b;border:1px solid #334155;color:#e2e8f0;padding:11px 16px;border-radius:8px;font-size:13px;z-index:100;display:none;max-width:300px}
.toast.show{display:block}.toast.ok{border-color:#16a34a}.toast.err{border-color:#dc2626}
.empty{text-align:center;padding:36px;color:#64748b;font-size:13px}
.spinner{display:inline-block;width:13px;height:13px;border:2px solid #334155;border-top-color:#3b82f6;border-radius:50%;animation:spin .7s linear infinite;vertical-align:middle;margin-right:5px}
@keyframes spin{to{transform:rotate(360deg)}}
</style>
</head>
<body>
<header>
  <h1>🏋️ Gym Members</h1>
  <a href="/">← Admin Panel</a>
</header>

<div class="top-bar">
  <select id="deviceSel" onchange="loadAll()">
    <option value="">Device load ho raha hai…</option>
  </select>
  <button class="btn btn-green" onclick="openAdd()">+ Add Member</button>
  <button class="btn btn-primary" onclick="loadAll()">↻ Refresh</button>
  <button class="btn" style="background:#f59e0b;color:#fff" onclick="cleanupExpired()">Remove Expired</button>
</div>

<div class="container">
  <div class="card">
    <div class="card-head">
      <span>All Members</span>
      <span id="countBadge" class="badge gray">—</span>
    </div>
    <table>
      <thead><tr>
        <th>Member ID</th><th>Name</th><th>Mobile</th>
        <th>Subscription</th><th>Status</th><th>Device</th><th>Actions</th>
      </tr></thead>
      <tbody id="tbody">
        <tr><td colspan="7" class="empty"><span class="spinner"></span>Loading…</td></tr>
      </tbody>
    </table>
  </div>
</div>

<!-- Add/Edit Modal -->
<div class="modal-bg" id="modalBg" onclick="if(event.target===this)closeModal()">
<div class="modal" id="modal">
  <h2 id="modalTitle">Member Add karo</h2>
  <input type="hidden" id="editId">
  <div class="form-row">
    <div class="form-group">
      <label>Naam *</label>
      <input id="fName" placeholder="Poora naam">
    </div>
    <div class="form-group">
      <label>Mobile</label>
      <input id="fMobile" placeholder="10-digit">
    </div>
  </div>
  <div class="form-group">
    <label>Email</label>
    <input id="fEmail" type="email" placeholder="email@example.com">
  </div>
  <div class="form-row">
    <div class="form-group">
      <label>Start Date</label>
      <input id="fStart" type="date">
    </div>
    <div class="form-group">
      <label>Subscription Expiry Date *</label>
      <input id="fEnd" type="date">
    </div>
  </div>
  <div class="form-group">
    <label>Address</label>
    <input id="fAddress" placeholder="Ghar ka pata">
  </div>
  <div class="form-group">
    <label>Notes</label>
    <input id="fNotes" placeholder="Koi note">
  </div>

  <!-- Enrollment section (only for existing members) -->
  <div class="enroll-section" id="enrollSection" style="display:none">
    <p style="margin-bottom:8px">Device pe Enroll karo (biometric scan)</p>
    <div class="enroll-btns">
      <button class="btn btn-sm btn-purple" onclick="enrollFrom('FACE')">Face</button>
      <button class="btn btn-sm btn-cyan"   onclick="enrollFrom('PALM')">Palm</button>
      <button class="btn btn-sm btn-teal"   onclick="enrollFrom('FP')">Fingerprint</button>
      <button class="btn btn-sm btn-red"    onclick="removeFromDevice()" id="removeBtn" style="display:none">Remove</button>
    </div>
    <p style="margin-top:10px;margin-bottom:6px;color:#64748b">Ya existing device user se link karo</p>
    <div style="display:flex;gap:6px;align-items:center">
      <input id="linkUserId" placeholder='Device user ID (e.g. "1")' style="background:#1e293b;border:1px solid #334155;color:#e2e8f0;padding:5px 9px;border-radius:5px;font-size:12px;width:180px">
      <button class="btn btn-sm" style="background:#334155;color:#e2e8f0" onclick="linkExisting()">Link</button>
    </div>
  </div>

  <div class="modal-footer">
    <button class="btn" style="background:#334155;color:#e2e8f0" onclick="closeModal()">Cancel</button>
    <button class="btn btn-primary" onclick="saveMember()" id="saveBtn">Save</button>
  </div>
</div>
</div>

<div class="toast" id="toast"></div>

<script>
const API = "";
let allMembers = [];
let currentMember = null;

function hdrs(){ return { "Content-Type":"application/json","x-api-key": localStorage.getItem("token")||"gymadmin@secret" }; }
function deviceId(){ return document.getElementById("deviceSel").value; }

function toast(msg, type="ok"){
  const t=document.getElementById("toast");
  t.textContent=msg; t.className=`toast show ${type}`;
  setTimeout(()=>t.className="toast",3500);
}

async function loadDevices(){
  try{
    const r=await fetch(`${API}/api/members/devices`,{headers:hdrs()});
    const d=await r.json();
    const sel=document.getElementById("deviceSel");
    if(!d.devices?.length){ sel.innerHTML='<option value="">Koi device registered nahi</option>'; return; }
    sel.innerHTML=d.devices.map(dv=>`<option value="${dv.device_id}">${dv.device_id}</option>`).join("");
    loadAll();
  }catch(e){ console.error(e); }
}

async function loadAll(){
  const did=deviceId();
  document.getElementById("tbody").innerHTML=`<tr><td colspan="7" class="empty"><span class="spinner"></span>Loading…</td></tr>`;
  try{
    const r=await fetch(`${API}/api/members${did?`?device_id=${did}`:""}`,{headers:hdrs()});
    const d=await r.json();
    allMembers=d.members||[];
    document.getElementById("countBadge").textContent=`${allMembers.length} members`;
    renderTable(allMembers);
  }catch(e){ toast(e.message,"err"); }
}

function daysBadge(end_date){
  if(!end_date) return `<span class="badge gray">No Date</span>`;
  const d=Math.ceil((new Date(end_date)-new Date())/86400000);
  if(d<0) return `<span class="badge r">Expired</span>`;
  if(d<=7) return `<span class="badge y">${d}d baki</span>`;
  return `<span class="badge g">${end_date}</span>`;
}

function renderTable(members){
  const tb=document.getElementById("tbody");
  if(!members.length){ tb.innerHTML=`<tr><td colspan="7" class="empty">Koi member nahi mila</td></tr>`; return; }
  tb.innerHTML=members.map(m=>{
    const enrolled=m.enrolled?`<span class="badge g">✓ ${m.enroll_method}</span>`:`<span class="badge gray">Not enrolled</span>`;
    return `<tr>
      <td><code>${m.member_id}</code></td>
      <td>${m.name||"—"}</td>
      <td>${m.mobile||"—"}</td>
      <td>${daysBadge(m.end_date)}</td>
      <td><span class="badge ${m.status==="Active"?"g":"r"}">${m.status||"—"}</span></td>
      <td>${enrolled}</td>
      <td>
        <button class="btn btn-sm btn-primary" onclick='openEdit(${JSON.stringify(m)})'>Edit</button>
        <button class="btn btn-sm btn-red" onclick="deleteMember('${m.id}','${m.name}')">Delete</button>
      </td>
    </tr>`;
  }).join("");
}

function openAdd(){
  currentMember=null;
  document.getElementById("modalTitle").textContent="Naya Member Add karo";
  document.getElementById("editId").value="";
  document.getElementById("fName").value="";
  document.getElementById("fMobile").value="";
  document.getElementById("fEmail").value="";
  document.getElementById("fStart").value=new Date().toISOString().split("T")[0];
  document.getElementById("fEnd").value="";
  document.getElementById("fAddress").value="";
  document.getElementById("fNotes").value="";
  document.getElementById("enrollSection").style.display="none";
  document.getElementById("saveBtn").textContent="Add Member";
  document.getElementById("modalBg").classList.add("open");
}

function openEdit(m){
  currentMember=m;
  document.getElementById("modalTitle").textContent=`Edit — ${m.member_id}`;
  document.getElementById("editId").value=m.id;
  document.getElementById("fName").value=m.name||"";
  document.getElementById("fMobile").value=m.mobile||"";
  document.getElementById("fEmail").value=m.email||"";
  document.getElementById("fStart").value=m.start_date||"";
  document.getElementById("fEnd").value=m.end_date||"";
  document.getElementById("fAddress").value=m.address||"";
  document.getElementById("fNotes").value=m.notes||"";
  document.getElementById("saveBtn").textContent="Update";

  // Enrollment section dikhao
  const es=document.getElementById("enrollSection");
  const rb=document.getElementById("removeBtn");
  if(deviceId()){
    es.style.display="block";
    rb.style.display=m.enrolled?"inline-block":"none";
  } else {
    es.style.display="none";
  }
  document.getElementById("modalBg").classList.add("open");
}

function closeModal(){ document.getElementById("modalBg").classList.remove("open"); }

async function saveMember(){
  const id=document.getElementById("editId").value;
  const body={
    name:document.getElementById("fName").value.trim(),
    mobile:document.getElementById("fMobile").value.trim(),
    email:document.getElementById("fEmail").value.trim(),
    start_date:document.getElementById("fStart").value,
    end_date:document.getElementById("fEnd").value,
    address:document.getElementById("fAddress").value.trim(),
    notes:document.getElementById("fNotes").value.trim(),
  };
  if(!body.name||!body.end_date){ toast("Naam aur End Date zaroori hain","err"); return; }

  try{
    let r;
    if(id){
      r=await fetch(`${API}/api/members/${id}`,{method:"PATCH",headers:hdrs(),body:JSON.stringify(body)});
    } else {
      r=await fetch(`${API}/api/members`,{method:"POST",headers:hdrs(),body:JSON.stringify(body)});
    }
    const d=await r.json();
    if(!r.ok) throw new Error(d.error);
    toast(id?"✅ Member updated":"✅ Member add ho gaya");
    closeModal();
    loadAll();
  }catch(e){ toast(e.message,"err"); }
}

async function deleteMember(id,name){
  if(!confirm(`"${name}" ko delete karna chahte ho?`)) return;
  try{
    const r=await fetch(`${API}/api/members/${id}`,{method:"DELETE",headers:hdrs()});
    const d=await r.json();
    if(!r.ok) throw new Error(d.error);
    toast("✅ Member delete ho gaya");
    loadAll();
  }catch(e){ toast(e.message,"err"); }
}

async function enrollFrom(method){
  if(!currentMember) return;
  const did=deviceId();
  if(!did){ toast("Device select nahi hai","err"); return; }
  if(!confirm(`${currentMember.name} ko ${method} se enroll karein?\n\nDevice enrollment mode mein jayega.`)) return;
  toast(`⏳ ${method} enrollment shuru ho raha hai…`);
  try{
    const r=await fetch(`${API}/api/enroll/start`,{
      method:"POST",headers:hdrs(),
      body:JSON.stringify({
        device_id:did,
        member_id:currentMember.member_id,
        member_name:currentMember.name,
        end_date:currentMember.end_date,
        method
      })
    });
    const d=await r.json();
    if(!r.ok) throw new Error(d.error);
    toast(`✅ ${d.message}`,"ok");
    closeModal();
    setTimeout(loadAll, 3000);
  }catch(e){ toast(e.message,"err"); }
}

async function removeFromDevice(){
  if(!currentMember) return;
  const did=deviceId();
  if(!confirm(`${currentMember.member_id} ko device se hatayen?`)) return;
  try{
    const r=await fetch(`${API}/api/enroll/${did}/${encodeURIComponent(currentMember.member_id)}`,{method:"DELETE",headers:hdrs()});
    const d=await r.json();
    if(!r.ok) throw new Error(d.error);
    toast("✅ Device se remove ho raha hai");
    closeModal();
    loadAll();
  }catch(e){ toast(e.message,"err"); }
}

async function linkExisting(){
  if(!currentMember) return;
  const did=deviceId();
  const uid=document.getElementById("linkUserId").value.trim();
  if(!did||!uid){ toast("Device ID aur User ID dono chahiye","err"); return; }
  try{
    const r=await fetch(`${API}/api/enroll/link`,{
      method:"POST",headers:hdrs(),
      body:JSON.stringify({
        device_id:did,
        member_id:currentMember.member_id,
        member_name:currentMember.name,
        end_date:currentMember.end_date,
        device_user_id:uid,
        method:"FACE"
      })
    });
    const d=await r.json();
    if(!r.ok) throw new Error(d.error);
    toast(`✅ ${d.message}`,"ok");
    closeModal();
    loadAll();
  }catch(e){ toast(e.message,"err"); }
}

async function cleanupExpired(){
  const did=deviceId();
  if(!did){ toast("Device select karo","err"); return; }
  try{
    const r=await fetch(`${API}/api/enroll/cleanup/${did}`,{method:"POST",headers:hdrs()});
    const d=await r.json();
    if(!r.ok) throw new Error(d.error);
    toast(`✅ ${d.removed} expired members remove ho gaye`);
    loadAll();
  }catch(e){ toast(e.message,"err"); }
}

window.addEventListener("load", loadDevices);
</script>
</body>
</html>
